<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhạc - EnRoy</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
    <link rel="icon" href="img/logo.png" type="image/png">
</head>
<body class="upload-page">
    <header class="header">
        <div class="header__logo">
            <a href="index.html"><img src="img/logo.png" alt="Logo"></a>
        </div>
        <a href="index.html" class="btn btn--secondary header__back-btn">
            <i class="ri-arrow-left-line"></i> Quay về Trang chủ
        </a>
    </header>

    <main class="main-container">
        <div class="upload-card">
            <div class="upload-card__header">
                <div class="upload-icon-badge">
                    <i class="ri-music-2-fill"></i>
                </div>
                <h1>Tải nhạc lên EnRoy</h1>
                <p>Chia sẻ giai điệu yêu thích của bạn đến với cộng đồng</p>
            </div>
            
            <form class="upload-form" id="upload-form">
                <!-- Chọn File Nhạc (MP3) -->
                <div class="form-group">
                    <label class="form-label">
                        <i class="ri-disc-line"></i> Tệp nhạc (Audio):
                    </label>
                    <input type="file" id="mp3-file" accept="audio/*" hidden>
                    <div class="file-dropzone" id="mp3-dropzone">
                        <label for="mp3-file" class="file-btn">
                            <i class="ri-upload-cloud-2-line"></i> Chọn tệp nhạc
                        </label>
                        <span id="file-name" class="file-name">Chưa chọn tệp nhạc (.mp3, .wav, .m4a)</span>
                    </div>
                </div>

                <!-- Chọn File Ảnh Bìa (Cover) -->
                <div class="form-group">
                    <label class="form-label">
                        <i class="ri-image-line"></i> Ảnh bìa bài hát (Cover Art):
                    </label>
                    <input type="file" id="cover-file" accept="image/*" hidden>
                    <div class="file-dropzone" id="cover-dropzone">
                        <div class="cover-preview-wrapper" id="cover-preview-box">
                            <i class="ri-image-add-line placeholder-icon"></i>
                            <img id="cover-preview-img" src="" alt="Preview" class="cover-preview-img hidden">
                        </div>
                        <div class="cover-upload-info">
                            <label for="cover-file" class="file-btn file-btn--accent">
                                <i class="ri-image-add-line"></i> Chọn ảnh bìa
                            </label>
                            <span id="cover-name" class="file-name">Chưa chọn ảnh bìa (.jpg, .png, .webp)</span>
                        </div>
                    </div>
                </div>

                <!-- Thông tin bài hát -->
                <div class="form-group">
                    <label class="form-label">
                        <i class="ri-information-line"></i> Thông tin bài hát:
                    </label>
                    <div class="input-field">
                        <i class="ri-song-line input-icon"></i>
                        <input type="text" id="song-title-input" placeholder="Nhập tên bài hát...">
                    </div>
                    <div class="input-field" style="margin-top: 10px;">
                        <i class="ri-user-3-line input-icon"></i>
                        <input type="text" id="song-artist-input" placeholder="Nhập tên nghệ sĩ...">
                    </div>
                </div>

                <!-- Nút gửi -->
                <button type="submit" id="submit-upload" class="submit-btn btn-full" disabled>
                    <span>Tải nhạc lên</span> <i class="ri-upload-2-line"></i>
                </button>
            </form>
        </div>
    </main>

    <script type="module" src="js/upload.js"></script>
</body>
</html>
