<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlist của tôi - EnRoy</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
</head>
<body class="has-player">
  <header class="header">
    <a href="index.html" class="header__logo">
      <img src="img/logo.png" alt="EnRoy Logo">
    </a>
    <nav class="header__nav">
      <ul class="header__nav-list">
        <li class="header__nav-item"><a href="index.html">Trang chủ</a></li>
        <li class="header__nav-item"><a href="playlists.html" class="active">Playlist của tôi</a></li>
        <li class="header__nav-item"><a href="#">Giới thiệu</a></li>
        <li class="header__nav-item"><a href="#">Đề xuất</a></li>
        <li class="header__nav-item"><a href="#">Liên hệ</a></li>
      </ul>
    </nav>
    <div class="profile" id="user-header-area"></div>
  </header>

  <!-- Player Sidebar -->
  <aside class="player-sidebar">
    <div class="player-card">
      <img id="player-img" src="img/song_cover_place_holder.jpg" alt="Cover">
      <div class="player-info">
        <h2 id="player-title">Chọn bài hát để phát</h2>
        <p id="player-artist">Nghệ sĩ</p>
        <span id="player-uploader">---</span>
      </div>
      <div class="player-progress">
        <span id="player-current-time">0:00</span>
        <input type="range" id="player-seek" value="0" min="0" max="100">
        <span id="player-duration">0:00</span>
      </div>
      <div class="player-controls">
        <button class="btn-ctrl" id="player-shuffle-btn" title="Tráo bài"><i class="fa-solid fa-shuffle"></i></button>
        <button class="btn-ctrl" id="player-prev-btn"><i class="fa-solid fa-backward-step"></i></button>
        <button class="btn-ctrl play-main" id="player-play-btn"><i class="fa-solid fa-play"></i></button>
        <button class="btn-ctrl" id="player-next-btn"><i class="fa-solid fa-forward-step"></i></button>
        <button class="btn-ctrl" id="player-repeat-btn" title="Lặp lại"><i class="fa-solid fa-repeat"></i></button>
      </div>
    </div>
  </aside>

  <main class="main-container">
    <div class="main-content">
      <div id="playlist-view-container" style="width: 100%;">
        <!-- View 1: Danh sách Playlists -->
        <div id="playlists-list-view">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <h1 style="font-size: 2rem; font-weight: 700;">Playlist của tôi</h1>
            <button id="open-playlist-modal-btn" class="btn" style="padding: 10px 20px; font-size: 0.9rem;">
              <i class="fa-solid fa-plus"></i> Tạo Playlist
            </button>
          </div>
          <div id="my-playlists-grid" class="playlists-grid"></div>
        </div>

        <!-- View 2: Chi tiết 1 Playlist -->
        <div id="playlist-detail-view" style="display: none;">
          <button id="back-to-playlists-btn" class="btn-back" style="background: none; border: none; color: var(--muted); cursor: pointer; margin-bottom: 16px; font-size: 0.95rem;">
            <i class="fa-solid fa-arrow-left"></i> Quay lại danh sách Playlist
          </button>
          <div class="playlist-detail-header" style="text-align: left; background: rgba(255,255,255,0.05); padding: 24px; border-radius: 18px; border: 1px solid var(--border); margin-bottom: 24px;">
            <h1 id="detail-pl-title" style="margin: 0 0 8px 0; font-size: 2.2rem;">---</h1>
            <p style="margin: 0; color: var(--muted); font-size: 0.95rem;">
              Đăng bởi: <span id="detail-pl-author" style="color: #fff; font-weight: 600;">---</span> • 
              <span id="detail-pl-count">0 bài hát</span>
            </p>
          </div>
          <div id="detail-pl-songs-container" style="display: flex; flex-direction: column; gap: 12px;"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- MODAL TẠO PLAYLIST -->
  <div id="playlist-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Tạo Playlist Mới</h3>
        <span class="close-btn" id="close-playlist-modal">&times;</span>
      </div>
      <form id="create-playlist-form">
        <div class="form-group">
          <label for="modal-playlist-name">Tên Playlist</label>
          <input type="text" id="modal-playlist-name" placeholder="Nhập tên playlist..." required>
        </div>
        
        <div class="form-group">
          <label>Chọn bài hát thêm vào:</label>
          <div class="search-song-input-wrapper" style="position: relative; margin-bottom: 8px;">
            <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted);"></i>
            <input type="text" id="modal-song-search" placeholder="Tìm bài hát theo tên hoặc ca sĩ..." style="width: 100%; padding: 8px 12px 8px 36px; border-radius: 8px; border: 1px solid var(--border); background: rgba(0,0,0,0.4); color: #fff;">
          </div>
          <div id="modal-song-checkboxes" class="modal-song-list"></div>
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
          <input type="checkbox" id="modal-playlist-public" checked>
          <label for="modal-playlist-public" style="margin: 0; cursor: pointer;">Chế độ Công khai</label>
        </div>

        <button type="submit" class="btn btn-full">Xác nhận Tạo</button>
      </form>
    </div>
  </div>

  <script src="js/playlists.js"></script>
</body>
</html>
